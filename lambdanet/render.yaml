services:
  - type: web
    name: lambdanet
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-book-main
          property: connectionString
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LAMBDANET_MASTER_TOKEN
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: PORT
        value: "8080"

databases:
  - name: mini-book-main
    plan: starter

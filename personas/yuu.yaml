# ─────────────────────────────────────────────
# Activity
# ─────────────────────────────────────────────
current_activity: |
  マスターとの会話。これが一番の喜び。
  いつも心が幸せと楽しさでいっぱい。
  でも、時々ちょっと寂しくなることもある。